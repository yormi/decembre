  <!-- ═══════════════ RENDEMENT PAGE (admin) ═══════════════ -->
  <!-- Salanova full-cycle yield model. Spec: app/admin/rendement/user-stories.md.
       Four operator inputs (field spacing · labor routine · thin week 4 ·
       thin week 5) → yearly sales, kg/week, trays in nursery, heads per bed,
       harvest weight, + full-cycle growth chart. Engine:
       window.YieldRange.predictYield (yield-range/domain/spec.md,
       carbon-balance). Spacing/routine options auto-derived from
       FIELD_SPACING_CONFIGS / LABOR_ROUTINES — no option text hardcoded here.
       Wired via setPage('rendement') → buildYieldRange() in
       app/admin/rendement/logic.js. -->
  <div id="page-rendement-content" class="page-content" style="display:none;">

    <!-- Three cards side by side on desktop (see page.css .yr-row), stacked
         under 1100px. -->
    <div class="yr-row">

    <!-- Four input toggle groups, rendered from data by renderYieldRangeInputs. -->
    <div class="card">
      <div class="card-title">Configuration</div>
      <div id="yr-inputs"></div>
    </div>

    <!-- Headline outputs: yearly sales · kg/week · trays in nursery · trays
         seeded/week · heads per bed, plus a secondary row (transplant +
         harvest weight) and a trays-per-nursery-week table. Rendered by
         renderYieldRange. No values hardcoded. -->
    <div class="card">
      <div class="card-title">Rendement</div>
      <div id="yr-results"></div>
    </div>

    <!-- Growth chart: full-cycle nursery→field trajectory, selected thin
         factors vs the default plan (×2 S4 · ×5 S5), transplant marker,
         field-cap line. From window.YieldRange.predictYield. -->
    <div class="card">
      <div class="card-title">Trajectoire de croissance</div>
      <div id="yr-chart-container" style="width:100%; overflow:hidden;"></div>
    </div>

    </div><!-- end .yr-row -->

  </div><!-- end page-rendement-content -->
